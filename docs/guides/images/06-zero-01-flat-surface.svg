<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="Arial, sans-serif">
  <rect width="700" height="350" fill="#eef5ff"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold">
    Условия калибровки нулевой точки
  </text>

  <!-- Ground -->
  <rect x="40" y="220" width="620" height="20" fill="#8d6e63"/>
  <line x1="40" y1="220" x2="660" y2="220" stroke="#5d4037" stroke-width="3"/>

  <!-- Car silhouette -->
  <g transform="translate(220 150)">
    <rect x="0" y="20" width="260" height="50" fill="#2c3e50" rx="8"/>
    <polygon points="30,20 70,-10 190,-10 230,20" fill="#34495e"/>
    <circle cx="55" cy="75" r="18" fill="#1a1a1a"/>
    <circle cx="55" cy="75" r="8" fill="#555"/>
    <circle cx="205" cy="75" r="18" fill="#1a1a1a"/>
    <circle cx="205" cy="75" r="8" fill="#555"/>
    <!-- windows -->
    <polygon points="40,20 75,0 125,0 125,20" fill="#aed6f1"/>
    <polygon points="135,20 135,0 185,0 220,20" fill="#aed6f1"/>
  </g>

  <!-- Angle indicator -->
  <text x="40" y="215" font-size="11">0°</text>
  <path d="M 55 230 L 85 230" stroke="#27ae60" stroke-width="2"/>
  <text x="90" y="235" font-size="11" fill="#27ae60">уклон &lt; 1°</text>

  <!-- Conditions list -->
  <g font-size="13">
    <text x="40" y="280" font-weight="bold">Обязательно:</text>
    <text x="40" y="300">✓ ровная поверхность</text>
    <text x="260" y="300">✓ руль по центру</text>
    <text x="460" y="300">✓ селектор P</text>
    <text x="40" y="320">✓ двигатель заглушен</text>
    <text x="260" y="320">✓ педали не нажаты</text>
    <text x="460" y="320">✓ автомобиль неподвижен</text>
  </g>
</svg>
