<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Arial, sans-serif">
  <rect width="640" height="340" fill="#f4f4f4"/>
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold">
    Снятие минусовой клеммы АКБ
  </text>

  <!-- Battery -->
  <rect x="180" y="90" width="280" height="160" fill="#1a1a1a" rx="8"/>
  <text x="320" y="80" text-anchor="middle" font-size="13" fill="#555">12 В аккумулятор</text>

  <!-- Positive terminal -->
  <rect x="220" y="80" width="40" height="20" fill="#c0392b"/>
  <text x="240" y="95" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">+</text>
  <text x="240" y="75" text-anchor="middle" font-size="11" fill="#c0392b">не трогать</text>

  <!-- Negative terminal (focus) -->
  <rect x="380" y="80" width="40" height="20" fill="#2c3e50"/>
  <text x="400" y="97" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">−</text>
  <circle cx="400" cy="90" r="30" fill="none" stroke="#f39c12" stroke-width="3" stroke-dasharray="4 3"/>
  <path d="M 480 50 L 420 80" stroke="#f39c12" stroke-width="3" marker-end="url(#ar5)"/>
  <defs>
    <marker id="ar5" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#f39c12"/>
    </marker>
  </defs>
  <text x="490" y="45" font-size="12" fill="#f39c12" font-weight="bold">снять эту</text>

  <!-- Labels -->
  <text x="320" y="190" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">Toyota 12V</text>
  <text x="320" y="215" text-anchor="middle" fill="#bbb" font-size="12">60 А·ч, 540 А</text>

  <!-- Timer -->
  <rect x="200" y="275" width="240" height="40" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="320" y="300" text-anchor="middle" font-size="15" font-weight="bold">
    ⏱ подождать ≥ 60 секунд
  </text>
</svg>
