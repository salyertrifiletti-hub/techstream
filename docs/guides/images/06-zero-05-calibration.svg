<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="Arial, sans-serif">
  <rect width="680" height="420" fill="#ececec"/>
  <rect x="20" y="20" width="640" height="380" fill="#fff" stroke="#888"/>
  <rect x="20" y="20" width="640" height="30" fill="#3b5998"/>
  <text x="35" y="40" fill="#fff" font-size="13" font-weight="bold">ABS/VSC/TRAC — Utility — Zero Point Calibration</text>

  <!-- Dialog -->
  <rect x="100" y="100" width="480" height="240" fill="#f9f9f9" stroke="#bbb" stroke-width="2"/>
  <text x="340" y="135" text-anchor="middle" font-size="15" font-weight="bold">
    Zero Point Calibration
  </text>
  <line x1="120" y1="150" x2="560" y2="150" stroke="#ddd"/>

  <text x="340" y="180" text-anchor="middle" font-size="12">Проверьте условия:</text>
  <text x="140" y="210" font-size="12">• автомобиль неподвижен ≥ 2 сек</text>
  <text x="140" y="230" font-size="12">• руль по центру</text>
  <text x="140" y="250" font-size="12">• селектор P, стояночный тормоз</text>
  <text x="140" y="270" font-size="12">• уклон поверхности &lt; 1°</text>

  <!-- Progress bar -->
  <rect x="140" y="290" width="400" height="18" fill="#e8e8e8" stroke="#aaa"/>
  <rect x="140" y="290" width="280" height="18" fill="#27ae60"/>
  <text x="340" y="304" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">70%</text>

  <!-- Buttons -->
  <rect x="380" y="355" width="80" height="30" fill="#27ae60" stroke="#1e8449" rx="4"/>
  <text x="420" y="375" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Start</text>
  <rect x="470" y="355" width="80" height="30" fill="#bdc3c7" stroke="#95a5a6" rx="4"/>
  <text x="510" y="375" text-anchor="middle" font-size="12">Cancel</text>
</svg>
