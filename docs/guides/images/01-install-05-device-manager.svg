<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Arial, sans-serif">
  <rect width="680" height="360" fill="#ececec"/>
  <rect x="20" y="20" width="640" height="320" fill="#fff" stroke="#888"/>
  <rect x="20" y="20" width="640" height="28" fill="#2c3e50"/>
  <text x="35" y="38" fill="#fff" font-size="12" font-weight="bold">Диспетчер устройств</text>

  <g font-size="13">
    <text x="40" y="80">▾ 💻 DESKTOP-ABC</text>
    <text x="60" y="105">▸ Батареи</text>
    <text x="60" y="130">▸ Видеоадаптеры</text>
    <text x="60" y="155" font-weight="bold" fill="#27ae60">▾ Порты (COM и LPT)</text>
