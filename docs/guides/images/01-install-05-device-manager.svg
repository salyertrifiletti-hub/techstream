  <!-- highlight boxes -->
  <rect x="85" y="165" width="260" height="22" fill="none" stroke="#27ae60" stroke-width="2"/>
  <rect x="85" y="220" width="260" height="22" fill="none" stroke="#27ae60" stroke-width="2"/>

  <text x="400" y="180" font-size="11" fill="#27ae60">← оба устройства должны быть здесь</text>
