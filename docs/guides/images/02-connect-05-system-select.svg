<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Arial, sans-serif">
  <rect width="720" height="520" fill="#ececec"/>
  <rect x="20" y="20" width="680" height="480" fill="#fff" stroke="#888"/>
  <rect x="20" y="20" width="680" height="30" fill="#3b5998"/>
  <text x="35" y="40" fill="#fff" font-size="13" font-weight="bold">System Select — Toyota Camry 2017 2.5L</text>

  <!-- Three columns -->
  <g font-size="13">
    <!-- Powertrain -->
    <rect x="40" y="80" width="200" height="400" fill="#f7fbff" stroke="#aac"/>
    <rect x="40" y="80" width="200" height="30" fill="#4a90e2"/>
    <text x="140" y="100" text-anchor="middle" fill="#fff" font-weight="bold">Powertrain</text>
    <circle cx="60" cy="135" r="6" fill="#2ecc71"/><text x="75" y="140">Engine and ECT</text>
    <circle cx="60" cy="165" r="6" fill="#2ecc71"/><text x="75" y="170">Cruise Control</text>
    <circle cx="60" cy="195" r="6" fill="#95a5a6"/><text x="75" y="200">EV Battery</text>

    <!-- Chassis -->
    <rect x="260" y="80" width="200" height="400" fill="#fff8f0" stroke="#aac"/>
    <rect x="260" y="80" width="200" height="30" fill="#e67e22"/>
    <text x="360" y="100" text-anchor="middle" fill="#fff" font-weight="bold">Chassis</text>
    <circle cx="280" cy="135" r="6" fill="#2ecc71"/><text x="295" y="140">ABS/VSC/TRAC</text>
    <circle cx="280" cy="165" r="6" fill="#2ecc71"/><text x="295" y="170">EPS</text>
    <circle cx="280" cy="195" r="6" fill="#95a5a6"/><text x="295" y="200">Air Suspension</text>

    <!-- Body -->
    <rect x="480" y="80" width="200" height="400" fill="#f3fff3" stroke="#aac"/>
    <rect x="480" y="80" width="200" height="30" fill="#27ae60"/>
    <text x="580" y="100" text-anchor="middle" fill="#fff" font-weight="bold">Body Electrical</text>
    <circle cx="500" cy="135" r="6" fill="#2ecc71"/><text x="515" y="140">SRS Airbag</text>
    <circle cx="500" cy="165" r="6" fill="#2ecc71"/><text x="515" y="170">Combination Meter</text>
    <circle cx="500" cy="195" r="6" fill="#2ecc71"/><text x="515" y="200">Immobiliser</text>
    <circle cx="500" cy="225" r="6" fill="#2ecc71"/><text x="515" y="230">Smart Key</text>
  </g>

  <!-- Legend -->
  <circle cx="50" cy="500" r="5" fill="#2ecc71"/>
  <text x="60" y="505" font-size="11">— связь установлена</text>
  <circle cx="220" cy="500" r="5" fill="#95a5a6"/>
  <text x="230" y="505" font-size="11">— блок отсутствует / не отвечает</text>
</svg>
