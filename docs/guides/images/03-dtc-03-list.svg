<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Arial, sans-serif">
  <rect width="760" height="420" fill="#ececec"/>
  <rect x="20" y="20" width="720" height="380" fill="#fff" stroke="#888"/>
  <rect x="20" y="20" width="720" height="30" fill="#3b5998"/>
  <text x="35" y="40" fill="#fff" font-size="13" font-weight="bold">Engine and ECT — Trouble Codes</text>

  <!-- Tabs -->
  <rect x="20" y="55" width="100" height="25" fill="#e74c3c"/>
  <text x="70" y="72" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Trouble Codes</text>
  <rect x="120" y="55" width="100" height="25" fill="#ddd" stroke="#aaa"/>
  <text x="170" y="72" text-anchor="middle" font-size="12">Data List</text>
  <rect x="220" y="55" width="100" height="25" fill="#ddd" stroke="#aaa"/>
  <text x="270" y="72" text-anchor="middle" font-size="12">Active Test</text>
  <rect x="320" y="55" width="100" height="25" fill="#ddd" stroke="#aaa"/>
  <text x="370" y="72" text-anchor="middle" font-size="12">Utility</text>

  <!-- Table header -->
  <rect x="30" y="100" width="700" height="30" fill="#f0f0f0" stroke="#ccc"/>
  <text x="60" y="120" font-size="12" font-weight="bold">DTC</text>
  <text x="160" y="120" font-size="12" font-weight="bold">Status</text>
  <text x="280" y="120" font-size="12" font-weight="bold">Description</text>

  <!-- Rows -->
  <g font-size="12">
    <rect x="30" y="130" width="700" height="28" fill="#fff" stroke="#eee"/>
    <text x="60" y="149">P0171</text><text x="160" y="149" fill="#c0392b">Current</text>
    <text x="280" y="149">System Too Lean (Bank 1)</text>

    <rect x="30" y="158" width="700" height="28" fill="#fafafa" stroke="#eee"/>
    <text x="60" y="177">P0300</text><text x="160" y="177" fill="#c0392b">Current</text>
    <text x="280" y="177">Random/Multiple Cylinder Misfire</text>

    <rect x="30" y="186" width="700" height="28" fill="#fff" stroke="#eee"/>
    <text x="60" y="205">P0420</text><text x="160" y="205" fill="#7f8c8d">History</text>
    <text x="280" y="205">Catalyst System Efficiency Below Threshold</text>
  </g>

  <!-- Buttons -->
  <rect x="500" y="340" width="100" height="35" fill="#95a5a6" stroke="#7f8c8d" rx="4"/>
  <text x="550" y="362" text-anchor="middle" fill="#fff" font-size="12">Freeze Frame</text>

  <rect x="610" y="340" width="100" height="35" fill="#e74c3c" stroke="#c0392b" rx="4"/>
  <text x="660" y="362" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Clear DTC</text>

  <path d="M 720 320 L 680 335" stroke="#c0392b" stroke-width="3" marker-end="url(#a3)"/>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="520" y="315" font-size="11" fill="#c0392b">Сначала Freeze Frame, потом Clear</text>
</svg>
