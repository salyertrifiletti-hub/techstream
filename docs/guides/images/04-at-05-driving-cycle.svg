<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Arial, sans-serif">
  <rect width="760" height="400" fill="#f9f9f9"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold">
    Цикл обкатки АКПП после сброса адаптации
  </text>

  <!-- Timeline -->
  <line x1="60" y1="200" x2="700" y2="200" stroke="#333" stroke-width="2"/>

  <!-- Phase 1 -->
  <circle cx="100" cy="200" r="20" fill="#3498db"/>
  <text x="100" y="207" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
  <text x="100" y="250" text-anchor="middle" font-size="12">Селектор</text>
  <text x="100" y="265" text-anchor="middle" font-size="12">P→R→N→D</text>
  <text x="100" y="280" text-anchor="middle" font-size="12">(по 3–5 сек)</text>

  <!-- Phase 2 -->
  <circle cx="250" cy="200" r="20" fill="#3498db"/>
  <text x="250" y="207" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
  <text x="250" y="250" text-anchor="middle" font-size="12">Разгон до</text>
  <text x="250" y="265" text-anchor="middle" font-size="12">60 км/ч</text>
  <text x="250" y="280" text-anchor="middle" font-size="12">педаль 20–40%</text>

  <!-- Phase 3 -->
  <circle cx="400" cy="200" r="20" fill="#3498db"/>
  <text x="400" y="207" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
  <text x="400" y="250" text-anchor="middle" font-size="12">Торможение</text>
  <text x="400" y="265" text-anchor="middle" font-size="12">двигателем</text>
  <text x="400" y="280" text-anchor="middle" font-size="12">до остановки</text>

  <!-- Phase 4 -->
  <circle cx="550" cy="200" r="20" fill="#3498db"/>
  <text x="550" y="207" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
  <text x="550" y="250" text-anchor="middle" font-size="12">Повторять</text>
  <text x="550" y="265" text-anchor="middle" font-size="12">10–15 раз</text>

  <!-- Finish -->
  <circle cx="680" cy="200" r="24" fill="#27ae60"/>
  <text x="680" y="208" text-anchor="middle" fill="#fff" font-weight="bold">✓</text>
  <text x="680" y="250" text-anchor="middle" font-size="12">15–30 мин</text>
  <text x="680" y="265" text-anchor="middle" font-size="12">спокойной езды</text>

  <!-- Warning -->
  <rect x="60" y="320" width="640" height="60" fill="#fff3cd" stroke="#f39c12"/>
  <text x="80" y="345" font-size="13" font-weight="bold" fill="#8a6d3b">⚠ Условия:</text>
  <text x="80" y="365" font-size="12" fill="#8a6d3b">
    ATF ≥ 60 °C • напряжение АКБ ≥ 12.4 В • без резких ускорений и кикдауна первые 50–100 км
  </text>
</svg>
