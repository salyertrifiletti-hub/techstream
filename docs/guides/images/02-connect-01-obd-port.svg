<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="Arial, sans-serif">
  <rect width="600" height="360" fill="#f4f4f4"/>
  <text x="300" y="30" text-anchor="middle" font-size="18" font-weight="bold">Разъём OBD-II (16 pin) под рулевой колонкой</text>

  <!-- OBD connector trapezoid -->
  <polygon points="150,120 450,120 430,220 170,220" fill="#2b2b2b" stroke="#000" stroke-width="2"/>
  <text x="300" y="105" text-anchor="middle" font-size="12" fill="#555">Трапециевидный, пластик, обычно чёрный</text>

  <!-- Pin rows -->
  <g fill="#d4af37">
    <circle cx="190" cy="150" r="6"/><circle cx="220" cy="150" r="6"/><circle cx="250" cy="150" r="6"/>
    <circle cx="280" cy="150" r="6"/><circle cx="310" cy="150" r="6"/><circle cx="340" cy="150" r="6"/>
    <circle cx="370" cy="150" r="6"/><circle cx="400" cy="150" r="6"/>
    <circle cx="195" cy="190" r="6"/><circle cx="223" cy="190" r="6"/><circle cx="251" cy="190" r="6"/>
    <circle cx="279" cy="190" r="6"/><circle cx="307" cy="190" r="6"/><circle cx="335" cy="190" r="6"/>
    <circle cx="363" cy="190" r="6"/><circle cx="391" cy="190" r="6"/>
  </g>
  <text x="155" y="155" font-size="11" fill="#fff">1</text>
  <text x="412" y="155" font-size="11" fill="#fff">8</text>
  <text x="160" y="195" font-size="11" fill="#fff">9</text>
  <text x="402" y="195" font-size="11" fill="#fff">16</text>

  <!-- Arrow -->
  <path d="M 300 260 L 300 300" stroke="#c0392b" stroke-width="3" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#c0392b"/>
    </marker>
  </defs>
  <text x="300" y="330" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">
    Расположен слева под рулём, рядом с панелью предохранителей
  </text>
</svg>
